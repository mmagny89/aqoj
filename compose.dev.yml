# Override developpement. Autosuffisant avec compose.yml seul :
#   docker compose -f compose.yml -f compose.dev.yml up -d
# (ou "docker compose up -d" nu, via COMPOSE_FILE du .env racine).
services:
  php:
    build:
      target: dev
    image: aqoj-php:dev
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE}
      # Pas de HTTP/3 en developpement : Caddy l'annonce (alt-svc h3, 30 jours), Chrome tente alors
      # du QUIC en UDP, que le relais UDP de Docker sur Mac n'achemine pas de facon fiable. Les
      # pages restent suspendues ou figees alors que curl (HTTP/2) repond en quelques ms (conventions, section 24).
      CADDY_GLOBAL_OPTIONS: |
        servers {
          protocols h1 h2
        }
      # Rechargement du worker : uniquement le code qui s'edite. Le motif par
      # defaut de  couvre tout /app, donc var/cache : chaque ecriture de
      # cache (Twig, conteneur, et phpunit depuis ce meme conteneur) redemarrait
      # les threads PHP, requetes en cours comprises — pages qui tournent en boucle.
      FRANKENPHP_WORKER_CONFIG: |
        watch /app/src/**/*.php
        watch /app/config/**/*.php
        watch /app/config/**/*.yaml
        watch /app/templates/**/*.twig
        watch /app/translations/**/*.yaml
    volumes:
      - ./app:/app
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"

  # Même image et même montage que « php » : sans le bind mount, le worker tournerait sur le code
  # figé dans l'image et ignorerait toute modification du planificateur.
  worker:
    build:
      target: dev
    image: aqoj-php:dev
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE}
    volumes:
      - ./app:/app

  database:
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

  # Attrapeur d'emails, developpement uniquement (section 8b) : absent de
  # compose.yml, donc de staging et de production, qui portent un vrai
  # transport dans leur fichier de secrets. Sans lui, eprouver un email en
  # developpement demande d'en envoyer un vrai.
  mailpit:
    image: axllent/mailpit:v${MAILPIT_VERSION}
    container_name: aqoj-${ENV:?ENV est requis — suffixe des noms de conteneurs, reseau et volumes. Le declarer dans le fichier de secrets (ENV=prod) ou le .env racine (ENV=dev)}-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      # L'interface web seulement : rien sur l'hote n'a de raison de
      # joindre le port SMTP.
      - "127.0.0.1:${MAILPIT_PORT}:8025"
    networks:
      - aqoj

  node:
    ports:
      - "${NODE_PORT}:5173"
    environment:
      VITE_USE_POLLING: ${VITE_USE_POLLING}
