services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC) en prod
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certs Let's Encrypt — doit persister en prod
      - caddy_config:/config
    environment:
      SERVER_NAME: ${SERVER_NAME:-http://:80}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    depends_on:
      - backend
      - frontend
    networks:
      - app
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/app
    environment:
      # DATABASE_URL est construit ici car il dépend du hostname Docker "database"
      # et des vars POSTGRES_* définies dans le .env.local racine.
      # Les autres vars Symfony (APP_ENV, APP_SECRET...) viennent de backend/.env.local
      # via le volume mount — Symfony les lit directement.
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - app
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "127.0.0.1:5432:5432"  # exposé uniquement sur localhost (PHPStorm, DBeaver…)
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app
    restart: unless-stopped

networks:
  app:
    driver: bridge

volumes:
  db_data:
  caddy_data:
  caddy_config:
  frontend_node_modules:
