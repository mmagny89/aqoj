name: Bogue
description: Quelque chose ne fonctionne pas comme prévu.
labels: [bogue]
body:
  - type: textarea
    id: constat
    attributes:
      label: Ce qui se passe
      description: Ce que vous avez vu, avec le message d'erreur s'il y en a un.
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Ce qui était attendu
    validations:
      required: true
  - type: textarea
    id: reproduire
    attributes:
      label: Comment le reproduire
      placeholder: |
        1. Aller sur…
        2. Cliquer sur…
    validations:
      required: true
  - type: input
    id: environnement
    attributes:
      label: Navigateur et appareil
      placeholder: Firefox 143, téléphone Android
