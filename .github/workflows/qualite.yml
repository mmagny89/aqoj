# Portes qualite et deploiement.
#
# Une porte = un job, nomme par ce qu'il prouve (skill ci-pipeline-standards).
# Les portes s'enchainent par cout croissant, et celles qui ne se doivent rien
# tournent en parallele. Contraintes d'infrastructure : section ci/qualite.
name: Qualité et déploiement

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Le code applicatif vit dans app/, la racine ne porte que l'infrastructure
# (section manifeste/fichiers). Le job de deploiement, qui ne fait aucun checkout, remet ce
# chemin a la racine.
defaults:
  run:
    working-directory: app

env:
  # Suit la BRANCHE de PHP_VERSION du .env racine — jamais plus recente que
  # l'image de production. Toute montee de version touche les deux fichiers,
  # plus le defaut de .github/actions/php/action.yml.
  PHP_VERSION: '8.5'

  # La CI n'utilise pas Docker Compose : rien n'injecte les variables du
  # conteneur. Sans celles-ci, le post-install-cmd de Composer echoue sur
  # « Environment variable not found », y compris dans les etapes qui ne
  # touchent jamais la base.
  APP_ENV: test
  DATABASE_URL: 'postgresql://app:app@127.0.0.1:5432/app?serverVersion=18&charset=utf8'
  MAILER_DSN: 'null://null'
  MAILER_FROM: 'noreply@aqoj.test'
  LIBRETRANSLATE_URL: 'http://libretranslate.invalid:5000'

jobs:
  # --- Porte 1 — rien en amont : c'est la moins chere, elle garde les autres.
  coherence:
    name: Cohérence du dépôt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/php

      - name: Coherence de composer.json
        run: composer validate --strict --no-check-publish

      - name: Lints Symfony
        run: |
          php bin/console lint:yaml config
          php bin/console lint:container

  # --- Porte 2 — ne depend de rien : une vulnerabilite connue est vraie que
  # le code soit bien indente ou non.
  securite:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/php

      # Bloquant : « cmd || true » avalerait une vulnerabilite connue.
      - name: Audit des dependances
        run: composer audit

  # --- Porte 3
  style:
    name: Style de code
    needs: coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/php

      # Une porte ignoree doit se voir sans ouvrir le job : d'ou le resume
      # d'execution, lisible depuis la pull request.
      - name: Style du code
        run: |
          if [ -x vendor/bin/php-cs-fixer ]; then
            vendor/bin/php-cs-fixer fix --dry-run --diff
          else
            echo "⊘ **Style de code** — PHP CS Fixer absent. L'activer : \`composer require --dev friendsofphp/php-cs-fixer\`" >> "$GITHUB_STEP_SUMMARY"
            echo "PHP CS Fixer absent — porte ignoree."
          fi

  # --- Porte 4
  analyse:
    name: Analyse statique
    needs: coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/php

      - name: Analyse statique
        run: |
          # phpstan-symfony lit le conteneur compile en environnement dev, chemin fige dans
          # phpstan.neon. La CI tournant en APP_ENV=test, var/cache/dev n'existe pas sans ce rechauffage.
          # APP_DEBUG=1 : le chemin vise le conteneur « Debug » (App_KernelDevDebugContainer.xml),
          # que cache:warmup ne produit qu'en mode debug.
          APP_DEBUG=1 php bin/console cache:warmup --env=dev
          vendor/bin/phpstan analyse --no-progress --error-format=github

  # --- Porte 5 — frontieres entre couches ou modules.
  frontieres:
    name: Frontières du code
    needs: coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/php

      - name: Frontieres du code
        run: |
          if [ -x vendor/bin/deptrac ] && [ -f deptrac.yaml ]; then
            vendor/bin/deptrac analyse --no-progress
          else
            echo "⊘ **Frontières du code** — Deptrac non configuré. L'activer : \`composer require --dev deptrac/deptrac\`, puis écrire \`deptrac.yaml\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Deptrac non configure — porte ignoree."
          fi

  # --- Porte 6 — la plus chere : elle attend que le code soit propre et
  # analyse avant d'allumer une base de donnees.
  tests:
    name: Tests unitaires et d'intégration
    needs: [style, analyse]
    runs-on: ubuntu-latest
    # Suit POSTGRES_VERSION du .env racine, comme PHP_VERSION ci-dessus.
    services:
      database:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/php

      # Les tests fonctionnels touchent la base : le schema de test (suffixe _test
      # de Doctrine) se construit par les migrations, comme en production. Sans
      # cette etape, tout test qui ecrit echoue sur « relation ... does not exist ».
      - name: Base de test
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists --no-interaction
          php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Tests
        run: vendor/bin/phpunit

  # --- Porte 7 — job distinct, et non une etape de « tests » : la suite
  # construit son schema sans passer par les migrations. Un job separe recoit
  # une base neuve.
  migrations:
    name: Schéma et migrations
    needs: coherence
    runs-on: ubuntu-latest
    # Suit POSTGRES_VERSION du .env racine, comme PHP_VERSION ci-dessus.
    services:
      database:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/php

      # Pas de « doctrine:schema:validate » : le schema evolue par migrations
      # SQL ecrites a la main et s'ecarte des mappings (colonne
      # user_game.bgg_user_rating hors entite, identifiants, index). A
      # rattraper avant de rendre ce controle bloquant.
      - name: Migrations rejouees sur une base neuve
        run: |
          # APP_ENV=test : Doctrine suffixe le nom de la base (app_test), que le service
          # PostgreSQL ne cree pas.
          php bin/console doctrine:database:create --if-not-exists --no-interaction
          php bin/console doctrine:migrations:migrate --no-interaction

  # --- Front (React) : independant du PHP.
  frontend:
    name: Front (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # --- Agregateur : un seul controle requis par la protection de branche.
  portes:
    name: Portes qualité
    needs: [coherence, securite, style, analyse, frontieres, tests, migrations, frontend]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      # Par env: et non en interpolation directe — un resultat interpole est
      # recopie dans le corps du script avant execution.
      - name: Verdict des portes
        env:
          RESULTATS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultats : $RESULTATS"
          case "$RESULTATS" in
            *failure*|*cancelled*)
              echo "Au moins une porte qualite a cede." >&2
              exit 1
              ;;
          esac
          echo "Toutes les portes qualite sont vertes."

  deploiement-prod:
    name: Deploiement
    needs: portes
    # Deux gardes cumulees, jamais une seule :
    #   - la branche, et jamais une pull request : une PR d'un depot tiers
    #     deploierait du code non relu ;
    #   - la variable de depot DEPLOIEMENT_PROD, comparee a « oui ».
    #     Absente, GitHub la rend comme une chaine vide et le job est
    #     ignore : ne rien deployer est le defaut. Une variable plutot
    #     qu'un secret — elle se lit dans un `if:`, sans rien de confidentiel.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOIEMENT_PROD == 'oui'
    runs-on: ubuntu-latest

    # Deux deploiements simultanes visent le meme stack sur l'hote : on
    # attend son tour, on ne coupe jamais un deploiement en cours.
    concurrency:
      group: deploiement-${{ github.ref_name }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: .

    steps:
      # GitHub remplace un secret absent par une chaine vide sans rien
      # signaler : ssh "@" produit alors une page d'usage illisible au lieu
      # d'une erreur.
      - name: Controler la presence des secrets
        env:
          HOTE: ${{ secrets.DEPLOIEMENT_HOTE }}
          UTILISATEUR: ${{ secrets.DEPLOIEMENT_UTILISATEUR }}
          CLE: ${{ secrets.DEPLOIEMENT_CLE_PRIVEE }}
          EMPREINTES: ${{ secrets.DEPLOIEMENT_KNOWN_HOSTS }}
        run: |
          manquants=""
          [ -n "$HOTE" ]        || manquants="$manquants DEPLOIEMENT_HOTE"
          [ -n "$UTILISATEUR" ] || manquants="$manquants DEPLOIEMENT_UTILISATEUR"
          [ -n "$CLE" ]         || manquants="$manquants DEPLOIEMENT_CLE_PRIVEE"
          [ -n "$EMPREINTES" ]  || manquants="$manquants DEPLOIEMENT_KNOWN_HOSTS"
          if [ -n "$manquants" ]; then
            echo "Secrets manquants :$manquants" >&2
            echo "Les poser avec : sh outils/installer-deploiement.sh projet prod" >&2
            exit 1
          fi

      - name: Preparer SSH
        env:
          CLE: ${{ secrets.DEPLOIEMENT_CLE_PRIVEE }}
          EMPREINTES: ${{ secrets.DEPLOIEMENT_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_deploiement
          chmod 600 ~/.ssh/id_deploiement
          # Empreinte epinglee, jamais StrictHostKeyChecking=no : ce serait
          # accepter n'importe quel serveur a cette adresse.
          printf '%s\n' "$EMPREINTES" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # La logique vit sur l'hote : la cle est restreinte a ce seul script
      # par une forced command dans authorized_keys.
      - name: Declencher le deploiement
        env:
          HOTE: ${{ secrets.DEPLOIEMENT_HOTE }}
          UTILISATEUR: ${{ secrets.DEPLOIEMENT_UTILISATEUR }}
        run: |
          ssh -i ~/.ssh/id_deploiement \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              "$UTILISATEUR@$HOTE" deployer

  deploiement-staging:
    name: Deploiement - staging
    needs: portes
    # Deux gardes cumulees, jamais une seule :
    #   - la branche, et jamais une pull request : une PR d'un depot tiers
    #     deploierait du code non relu ;
    #   - la variable de depot DEPLOIEMENT_STAGING, comparee a « oui ».
    #     Absente, GitHub la rend comme une chaine vide et le job est
    #     ignore : ne rien deployer est le defaut. Une variable plutot
    #     qu'un secret — elle se lit dans un `if:`, sans rien de confidentiel.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.DEPLOIEMENT_STAGING == 'oui'
    runs-on: ubuntu-latest

    # Deux deploiements simultanes visent le meme stack sur l'hote : on
    # attend son tour, on ne coupe jamais un deploiement en cours.
    concurrency:
      group: deploiement-${{ github.ref_name }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: .

    steps:
      # GitHub remplace un secret absent par une chaine vide sans rien
      # signaler : ssh "@" produit alors une page d'usage illisible au lieu
      # d'une erreur.
      - name: Controler la presence des secrets
        env:
          HOTE: ${{ secrets.STAGING_DEPLOIEMENT_HOTE }}
          UTILISATEUR: ${{ secrets.STAGING_DEPLOIEMENT_UTILISATEUR }}
          CLE: ${{ secrets.STAGING_DEPLOIEMENT_CLE_PRIVEE }}
          EMPREINTES: ${{ secrets.STAGING_DEPLOIEMENT_KNOWN_HOSTS }}
        run: |
          manquants=""
          [ -n "$HOTE" ]        || manquants="$manquants STAGING_DEPLOIEMENT_HOTE"
          [ -n "$UTILISATEUR" ] || manquants="$manquants STAGING_DEPLOIEMENT_UTILISATEUR"
          [ -n "$CLE" ]         || manquants="$manquants STAGING_DEPLOIEMENT_CLE_PRIVEE"
          [ -n "$EMPREINTES" ]  || manquants="$manquants STAGING_DEPLOIEMENT_KNOWN_HOSTS"
          if [ -n "$manquants" ]; then
            echo "Secrets manquants :$manquants" >&2
            echo "Les poser avec : sh outils/installer-deploiement.sh projet staging" >&2
            exit 1
          fi

      - name: Preparer SSH
        env:
          CLE: ${{ secrets.STAGING_DEPLOIEMENT_CLE_PRIVEE }}
          EMPREINTES: ${{ secrets.STAGING_DEPLOIEMENT_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_deploiement
          chmod 600 ~/.ssh/id_deploiement
          # Empreinte epinglee, jamais StrictHostKeyChecking=no : ce serait
          # accepter n'importe quel serveur a cette adresse.
          printf '%s\n' "$EMPREINTES" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # La logique vit sur l'hote : la cle est restreinte a ce seul script
      # par une forced command dans authorized_keys.
      - name: Declencher le deploiement
        env:
          HOTE: ${{ secrets.STAGING_DEPLOIEMENT_HOTE }}
          UTILISATEUR: ${{ secrets.STAGING_DEPLOIEMENT_UTILISATEUR }}
        run: |
          ssh -i ~/.ssh/id_deploiement \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              "$UTILISATEUR@$HOTE" deployer
