name: Qualité et déploiement

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Symfony)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/app?serverVersion=16&charset=utf8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, mbstring
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Audit des dépendances
        run: composer audit
      - name: Analyse statique
        run: |
          APP_ENV=dev php bin/console cache:warmup
          vendor/bin/phpstan analyse --no-progress
      - name: Base de test
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction
      - name: Tests
        run: vendor/bin/phpunit

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
