# Publication d'une version — cree la release GitHub a partir du CHANGELOG.
#
# Declenche par un tag "v*", jamais par un push de branche : decider qu'une
# version sort est un geste volontaire, et le tag est cet endroit.
#
#   git tag -a v1.1.0 -m "v1.1.0"
#   git push origin v1.1.0
#
# Le corps de la release vient de outils/extraire-changelog.sh — versionne avec
# le projet, donc jouable en local avant d'etiqueter : une section absente ou
# mal formee se voit avant la publication et non apres. .claude/ n'arrive
# jamais dans le depot (conventions, section 1), le workflow ne peut pas
# appeler la bibliotheque directement.
name: Release

on:
  push:
    tags:
      - 'v*'

# Le deploiement, lui, se declenche sur main et develop (qualite.yml) : pousser
# un tag ne redeploie rien, et ne doit rien redeployer.
permissions:
  contents: write

jobs:
  publication:
    name: Creer la release
    runs-on: ubuntu-latest

    # Le job ne touche pas au code applicatif : il lit le CHANGELOG a la racine
    # (qualite.yml, lui, travaille dans app/).
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v7

      # Un tag pose sur un commit dont le CHANGELOG ne dit rien produirait une
      # release vide, que personne ne remarquerait avant d'en avoir besoin. Le
      # script echoue en listant les sections qui existent.
      - name: Extraire la section du CHANGELOG
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo 'corps<<FIN_DE_SECTION'
            sh outils/extraire-changelog.sh "$TAG"
            echo 'FIN_DE_SECTION'
          } >> "$GITHUB_OUTPUT"

      - name: Creer la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          CORPS: ${{ steps.changelog.outputs.corps }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$CORPS" \
            --verify-tag
