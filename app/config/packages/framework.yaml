framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true

    # API stateless — pas de sessions
    session:
        enabled: false

    # Pas de protection CSRF pour une API stateless
    csrf_protection: false

    php_errors:
        log: true

    # Vide en dev ; private_ranges derrière Traefik (staging, prod) : l'adresse du client vient de X-Forwarded-For.
    trusted_proxies: '%env(default::SYMFONY_TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-host', 'x-forwarded-port']

    rate_limiter:
        # Essais de connexion : 5 par quart d'heure pour un même e-mail depuis une même adresse,
        # 20 par quart d'heure pour une même adresse (balayage de comptes).
        login:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        login_ip:
            policy: sliding_window
            limit: 20
            interval: '15 minutes'
        register:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # API publique en lecture, par adresse. Plafonds larges exprès : une soirée d'association met vingt
        # personnes derrière la même adresse, et chacune cherche en tapant. Le catalogue que BG-TCG aspire page
        # à page (500 fiches par page) se lit en deux minutes ; la recherche, qui peut interroger BGG en repli,
        # est la plus serrée des trois.
        catalogue:
            policy: sliding_window
            limit: 240
            interval: '1 minute'
        search:
            policy: sliding_window
            limit: 120
            interval: '1 minute'
        public_api:
            policy: sliding_window
            limit: 600
            interval: '1 minute'
        # Mot de passe oublié et réinitialisation : par adresse et par e-mail ciblé, contre l'inondation de
        # boîtes aux lettres et le balayage de jetons.
        password_reset:
            policy: sliding_window
            limit: 5
            interval: '1 hour'

when@test:
    framework:
        test: true
        cache:
            pools:
                # Fichiers, pour que l'état des limiteurs survive au redémarrage du noyau entre deux requêtes ;
                # les tests le vident (ApiTestCase::setUp).
                cache.rate_limiter:
                    adapter: cache.adapter.filesystem
